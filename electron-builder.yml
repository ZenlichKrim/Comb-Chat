appId: com.zenlichkrim.comb
productName: Comb Chat
copyright: Copyright © 2026 ZenlichKrim

directories:
  buildResources: resources
  output: release

files:
  - out/**/*
  - resources/**/*
  - package.json
  - '!**/*.map'
  - '!node_modules/**/{test,__tests__,tests,spec,example,examples,docs}/**'

asar: true
asarUnpack:
  - '**/*.node'

npmRebuild: true
nodeGypRebuild: false
buildDependenciesFromSource: false

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: resources/icon.ico
  artifactName: Comb-Chat-${version}-${arch}.${ext}
  executableName: CombChat
  fileAssociations: []

portable:
  artifactName: Comb-Chat-${version}-portable-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Comb Chat
  deleteAppDataOnUninstall: false
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  icon: resources/icon-256.png
  darkModeSupport: true
  artifactName: Comb-Chat-${version}-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: resources/icon-256.png
  category: Development
  maintainer: ZenlichKrim <zenlich@users.noreply.github.com>
  synopsis: AI coding agent for your desktop
  artifactName: Comb-Chat-${version}-${arch}.${ext}

publish: null
