name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck
        continue-on-error: true

      - name: Build installer + portable exe
        shell: bash
        run: npm run dist:win > build-win.log 2>&1 || (tail -n 120 build-win.log > build-tail.log; echo "BUILD FAILED"; exit 1)

      - name: Publish failure log
        if: failure()
        shell: bash
        run: |
          git config user.name "comb-ci"
          git config user.email "ci@comb.local"
          git checkout -b ci-logs || git checkout ci-logs
          git add -f build-tail.log build-win.log 2>/dev/null || true
          git commit -m "ci: windows build log" || true
          git push -f origin ci-logs || true

      - name: Verify packaged app
        if: success()
        shell: bash
        run: |
          ls -la release
          node -e "const {execSync}=require('child_process');const out=execSync('npx asar list release/win-unpacked/resources/app.asar',{maxBuffer:1e9}).toString();console.log('asar entries:', out.split('\n').length);console.log('node-pty in asar:', /node-pty/.test(out));"
        continue-on-error: true

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: comb-chat-windows
          path: |
            release/*.exe
          retention-days: 30

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build AppImage + deb
        run: npm run dist:linux > /tmp/build-linux.log 2>&1 || (tail -n 100 /tmp/build-linux.log; exit 1)
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: comb-chat-linux
          path: |
            release/*.AppImage
            release/*.deb
          retention-days: 30

  release:
    needs: [windows, linux]
    if: ${{ always() && (needs.windows.result == 'success' || needs.linux.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Gather installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -la dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Comb Chat v1.0.0 (build ${{ github.run_number }})
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            **Comb Chat** — a desktop AI coding agent that runs on your own DeepSeek key.

            ### Windows x64
            - `Comb-Chat-1.0.0-x64.exe` — installer (choose install folder, Start-menu + desktop shortcut)
            - `Comb-Chat-1.0.0-portable-x64.exe` — single-file portable, nothing to install

            ### Linux x64
            - `Comb-Chat-1.0.0-x86_64.AppImage` — `chmod +x` and run
            - `Comb-Chat-1.0.0-amd64.deb` — `sudo dpkg -i`

            ### First run
            1. Paste a DeepSeek API key ([get one](https://platform.deepseek.com/api_keys)).
            2. Open a project folder (`Ctrl O`).
            3. Describe a task. Comb reads, edits and runs tests — and asks before anything destructive.

            Unsigned build: SmartScreen may warn on first launch → *More info → Run anyway*.
          files: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
